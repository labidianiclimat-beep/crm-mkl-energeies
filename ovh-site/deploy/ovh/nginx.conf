# Ne pas remplacer tel quel le fichier déjà modifié par Certbot.
# Copier les locations de refus dans les blocs server existants (port 80 et port 443),
# puis : sudo nginx -t && sudo systemctl reload nginx
# Le remplacement complet de ce fichier effacerait le certificat HTTPS.
#
# MODIFICATION À APPLIQUER — un seul bloc à ajouter, dans les DEUX blocs server
# (port 80 et port 443), au-dessus de « location ^~ /lib/ { return 404; } » :
#
#     location = /lib/attribution-capture.mjs {
#         proxy_pass http://127.0.0.1:4317;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
# Rien d’autre ne change. Le refus préfixe sur /lib/, /data/, /tests/,
# /deploy/, /node_modules/ et les fichiers cachés reste en place : en Nginx une
# location exacte (=) est évaluée avant une location préfixe (^~), donc ce bloc
# n’affaiblit aucune des protections existantes.
#
# Vérification après rechargement, depuis un poste extérieur :
#     curl -sI https://mkl-energies.fr/lib/attribution-capture.mjs   → 200
#     curl -sI https://mkl-energies.fr/lib/lead-attribution.mjs      → 404
#     curl -sI https://mkl-energies.fr/lib/crm-sync.mjs              → 404
#     curl -sI https://mkl-energies.fr/lib/admin-auth.mjs            → 404

server {
    listen 80;
    listen [::]:80;
    server_name mkl-energies.fr www.mkl-energies.fr;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mkl-energies;
        default_type text/plain;
    }

    # Jamais de fichier caché, de code serveur, ni de stockage commercial.
    location ~ /\.(?!well-known) {
        default_type text/plain;
        return 404;
    }

    location = /server.mjs { return 404; }
    location = /package.json { return 404; }
    location = /package-lock.json { return 404; }

    # Ces quatre refus ont été appliqués en production le 7 novembre 2026, après
    # avoir constaté que `deploy/` y était servi publiquement : soixante-cinq
    # fichiers, dont les scripts de déploiement, des rapports internes, et deux
    # sauvegardes `.env` contenant SESSION_SECRET et ADMIN_PASSWORD_HASH.
    #
    # Le préfixe `^~` est délibéré : il l'emporte sur les expressions
    # régulières, donc aucune règle ultérieure ne peut rouvrir le chemin.
    location ^~ /deploy/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ^~ /tests/ { return 404; }

    # Filet de sécurité par extension, pour un fichier oublié hors de ces
    # dossiers. Volontairement sans `.mjs` : deux modules de `/lib/` sont
    # publics par conception, et un tel motif les casserait — les locations
    # exactes qui les autorisent sont plus bas, mais une expression régulière
    # placée ici serait évaluée avant elles.
    location ~* \.(env|sh|service|timer|lock)$ { return 404; }

    location = /lib/conversion-datalayer.mjs {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /lib/form-legal-copy.mjs {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Capture de provenance publicitaire. Une location exacte (=) l’emporte sur
    # le refus préfixe (^~) ci-dessous : un seul module de plus est exposé, les
    # autres restent refusés par Nginx avant même d’atteindre Node.
    location = /lib/attribution-capture.mjs {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /lib/ { return 404; }

    location = /data/covers.json {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /data/category-covers.json {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /data/slots.js {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /data/realisations.js {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /data/ { return 404; }

    # Assets versionnés (?v=…) : servi directement + cache navigateur long
    location ^~ /assets/ {
        root /var/www/mkl-energies;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~ /\. { return 404; }
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
